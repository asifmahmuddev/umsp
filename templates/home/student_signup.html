{% extends 'home/base.html' %}
{% load crispy_forms_filters %}
{% load crispy_forms_tags %}

{% block content %}

<header class="bg-primary-gradient pt-6"><!-- Start: Hero Clean Reverse -->
    <div class="container">
            {% if messages %}
                {% for message in messages %}
                    <div class="alert {{ message.tags }} alert-dismissible fade show" role="alert">
                        {{ message }}
                    </div>
                {% endfor %}
            {% endif %}
        </div>
    <div class="container">
        <div class="row pt-5">
            <div class="col-md-8 col-xl-6 text-center text-md-start mx-auto">
                <div class="text-center pb-5"><h4 class="fw-bold text-dark mb-2"><strong>Student Register</strong><br>
                </h4></div>
                <div class="text-center pb-5">
                    <form method="post" id="StudentSignUpForm" accept-charset="utf-8">{% csrf_token %}
                        <table>{{form|crispy}}</table>
                        <div class="pt-3">
                            <button class="btn btn-primary shadow indx-btn w-15" type="submit" name="submit" value="Signup">Singup</button>
                        </div>
                    </form>
                </div>
            </div>
            <div class="col-md-8 col-xl-6 text-center text-md-start mx-auto pt-5">
                <div class="text-center pb-5"><h4 class="fw-bold text-dark mb-2">Register Using Excel File</h4></div>
                <div class="text-center pb-5">
                    <form>
                        <div class="pb-3"><input class="form-control form-control-sm w-50 d-inline-block" type="file">
                        </div>
                        <div>
                            <button class="btn btn-primary shadow indx-btn w-15" type="submit">Register</button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div><!-- End: Hero Clean Reverse --></header>
{% endblock %}
